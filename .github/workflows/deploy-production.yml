name: deploy-production

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gol-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Publish CI-approved production commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "Production release approved for $RELEASE_COMMIT"
