name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: gol_test
          POSTGRES_PASSWORD: gol_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.17.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:gol_test_password@127.0.0.1:5432/gol_test
      - run: pnpm --filter @gol/web build
      - run: pnpm --filter @gol/subgraph codegen
      - run: pnpm --filter @gol/subgraph build

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.5.1 }
      - run: forge test --root contracts -vvv
      - run: forge test --root contracts --match-contract GolAccountInvariantTest --runs 128 --depth 64

  arm64-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/arm64 --target web -f deploy/Dockerfile .
      - run: docker buildx build --platform linux/arm64 --target worker -f deploy/Dockerfile .
