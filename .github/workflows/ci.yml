name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.17.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @gol/web build
      - run: pnpm --filter @gol/subgraph codegen
      - run: pnpm --filter @gol/subgraph build

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.5.1 }
      - run: forge test --root contracts -vvv
      - run: forge test --root contracts --match-contract GolAccountInvariantTest --runs 128 --depth 64

  arm64-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/arm64 --target web -f deploy/Dockerfile .
      - run: docker buildx build --platform linux/arm64 --target worker -f deploy/Dockerfile .
