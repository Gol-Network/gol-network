[project]
name = "gol-langgraph-agent"
version = "0.1.0"
description = "Separate LangGraph and AG-UI streaming service for GOL Agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "ag-ui-langgraph[fastapi]>=0.0.43,<0.1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gol_agent"]
