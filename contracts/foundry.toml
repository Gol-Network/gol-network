[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = [
  "aave-v3-origin/=lib/aave-v3-origin/",
  "forge-std/=lib/aave-v3-origin/lib/forge-std/src/",
  "solidity-utils/=lib/aave-v3-origin/lib/solidity-utils/src/",
  "openzeppelin-contracts-upgradeable/=lib/aave-v3-origin/lib/solidity-utils/lib/openzeppelin-contracts-upgradeable/",
  "openzeppelin-contracts/=lib/aave-v3-origin/lib/solidity-utils/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/",
]
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 64, fail_on_revert = false }
ffi = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
